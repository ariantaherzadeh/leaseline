# Netlify builds the public Next.js site in apps/site (an npm workspace; dependencies are
# installed from the repo root). The build first runs `leaseline export-site` (Python, via uv).

[build]
  base = "apps/site"
  command = "pip install --quiet uv && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  LEASELINE_TENANT = "demo"

# Security headers are set in apps/site/next.config.ts (they must cover server-rendered pages).
# Netlify's Next.js runtime: serverless functions for /team and /api, prerendered pages on the CDN.
[[plugins]]
  package = "@netlify/plugin-nextjs"
