name: Deploy ElevenLabs

# Syncs ElevenLabs (agent + knowledge base) for each tenant: agent config from the repo,
# published listings from Supabase. Runs on every merge to main, and every 10 minutes so
# listings edited in the dashboard reach the assistant without a code change (the run is a
# no-op when nothing changed; it also keeps the free Supabase project from pausing).
# The public site is built by Netlify's Git integration and reads listings from Supabase itself.
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; queue them instead of cancelling a half-finished sync.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  elevenlabs:
    name: Sync ElevenLabs
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Deploy every tenant
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # Removing more than half of a tenant's listings needs an explicit opt-in.
          ALLOW_MASS_DELETE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[allow-mass-delete]') }}
        run: |
          flag=""
          [[ "$ALLOW_MASS_DELETE" == "true" ]] && flag="--allow-mass-delete"
          for dir in tenants/*/; do
            slug=$(basename "$dir")
            [[ "$slug" == _* ]] && continue
            echo "::group::$slug"
            uv run leaseline deploy --tenant "$slug" $flag | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done
