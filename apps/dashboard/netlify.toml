# Netlify site for the leasing team's dashboard (app.tryleaseline.com).
# In the Netlify UI, set this site's Base directory to apps/dashboard so this file is used.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security headers are set in next.config.ts (they must cover server-rendered pages).
