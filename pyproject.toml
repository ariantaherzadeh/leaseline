[project]
name = "leaseline"
version = "0.1.0"
description = "AI voice leasing assistant built on ElevenLabs Agents: agent-as-code and git-driven listings."
readme = "README.md"
license = "MIT"
authors = [{ name = "Arian Taherzadeh" }]
requires-python = ">=3.12"
dependencies = [
    "elevenlabs>=2.60",
    "httpx>=0.28",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
leaseline = "leaseline.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["leaseline", "fake_elevenlabs"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI options as argument defaults.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["tests"]
